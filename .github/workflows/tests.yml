name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --locked --all-extras
      - name: Run full test suite
        run: uv run --locked --all-extras pytest -q
      - name: Build package
        run: uv build
